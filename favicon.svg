<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <style>
    .accent { fill: none; stroke: #DF5D8D; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
    .main { fill: none; stroke: #1C1618; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
